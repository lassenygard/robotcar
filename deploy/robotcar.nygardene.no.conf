# Edge host 192.168.4.58. Application authentication is enforced on Pi 5.
server {
    listen 80;
    listen [::]:80;
    server_name robotcar.nygardene.no;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://robotcar.nygardene.no$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name robotcar.nygardene.no;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/robotcar.nygardene.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robotcar.nygardene.no/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ROBOTCAR_SSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16k;
    send_timeout 5s;
    access_log /var/log/nginx/robotcar.nygardene.no-access.log;
    error_log /var/log/nginx/robotcar.nygardene.no-error.log warn;

    include /etc/nginx/snippets/robotcar-proxy.conf;
}
