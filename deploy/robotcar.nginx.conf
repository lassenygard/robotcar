# Include these locations in the HTTPS server for robotcar.nygardene.no.
# Configure DNS and the TLS certificate on the existing edge host first.
# This is a location fragment, not a complete nginx.conf.
location / {
    proxy_pass http://192.168.4.44:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
location /ws {
    proxy_pass http://192.168.4.44:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
}
