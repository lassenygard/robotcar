name: Robotcar runtime tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q robotcar
      - run: python -m unittest discover -s diagnostics/camera-isolation -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_map_ui.cjs
